# Which Rust builds SignSpector? Exactly this version, on every machine and in CI.
#
# Why pinned? A new Rust release can add lints, and clippy runs with -D warnings: the build
# must not break on its own. We move to a new version on purpose, in its own commit.
#
# How to update:
#   1. rustup check                      (shows the latest stable)
#   2. change `channel` below, then: rustup show
#   3. cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo nextest run
#   4. commit alone ("Rust 1.x.y"); CI runs the four jobs on the new version.
#
# Which targets, and why? The release builds (R24 in docs/design.md):
#   aarch64-apple-darwin, x86_64-apple-darwin   macOS arm64 and Intel (universal binary)
#   x86_64-pc-windows-gnu                       Windows, mingw-w64 (linker in .cargo/config.toml)
#   x86_64-unknown-linux-musl                   Linux, one static binary (cargo zigbuild);
#                                               the .deb, .rpm and .tar.gz are made from it (R25)
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-musl",
]
