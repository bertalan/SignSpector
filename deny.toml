# cargo deny check: known vulnerabilities, licences, duplicate crates, crate sources.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-musl",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
# Pure Rust only: one self-contained executable per platform.
deny = [
    { name = "openssl-sys" },
    { name = "openssl" },
    { name = "native-tls" },
    { name = "openssl-src" },
    { name = "aws-lc-sys" },
    { name = "aws-lc-rs" },
    { name = "libz-sys" },
    { name = "zstd-sys" },
    { name = "bzip2-sys" },
    { name = "cmake" },
    # `ring` (C + assembly, cross-compiles fine) is still to decide: see docs/design.md.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Our own crate is private (publish = false): no licence check.
[licenses.private]
ignore = true
