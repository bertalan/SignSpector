# Tests may unwrap/expect/index freely: a panic there is a failing test, which is what we want.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Proper nouns used in doc comments.
doc-valid-idents = ["SignSpector", "CAdES", "PAdES", "XAdES", "AgID", ".."]
