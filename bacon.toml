# `bacon` re-runs the selected job on every save. Default: the test suite (TDD loop).
# Keys: t = test, c = clippy, d = doc. See https://dystroy.org/bacon/
default_job = "test"

[jobs.test]
command = ["cargo", "nextest", "run", "--color", "always", "--hide-progress-bar", "--failure-output", "final"]
need_stdout = true
analyzer = "nextest"

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--color", "always", "--", "-D", "warnings"]
need_stdout = false

[jobs.doc]
command = ["cargo", "doc", "--no-deps", "--color", "always"]
need_stdout = false

[keybindings]
t = "job:test"
c = "job:clippy"
d = "job:doc"
