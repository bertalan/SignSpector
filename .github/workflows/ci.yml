# Tests on real Windows, macOS and Linux machines, on the targets we ship, plus the repository
# rules. Actions are pinned to commit SHAs (tag in the comment): a moved tag cannot change what
# runs. Merge only when every job is green (branch protection on main).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: "17 5 * * 1" # weekly: new advisories against unchanged dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: every pushed commit must be scanned and tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # also on Windows: stop on the first failing command

env:
  CARGO_TERM_COLOR: always
  # Note: RUSTFLAGS here replaces any `rustflags` in .cargo/config.toml; move both together.
  RUSTFLAGS: -D warnings

jobs:
  rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: audit cadence and per-commit scan
          persist-credentials: false
      - name: Tests of the rule scripts
        run: sh scripts/test-scripts.sh
      - name: Public repository check (files and message of every new commit)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            commits=$(git rev-list "$BASE..$HEAD_SHA")
          else
            # First push, force-push or scheduled run: base unknown, scan the whole history.
            commits=$(git rev-list "$HEAD_SHA")
          fi
          n=0
          for c in $commits; do
            echo "scanning $(git log -1 --format='%h %s' "$c")"
            sh scripts/check-public.sh --tree "$c"
            n=$((n + 1))
          done
          echo "commits scanned: $n"
      - name: Same check with the rules of the base branch (a PR cannot loosen its own rules)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOW_RULES_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-rules-change') }}
        run: |
          git show "$BASE:scripts/check-public.sh" > "$RUNNER_TEMP/base-check-public.sh"
          status=0
          for c in $(git rev-list "$BASE..$HEAD_SHA"); do
            sh "$RUNNER_TEMP/base-check-public.sh" --tree "$c" || status=1
          done
          if [ "$status" -ne 0 ]; then
            if [ "$ALLOW_RULES_CHANGE" = true ]; then
              echo "::warning::base rules reject this PR; accepted because of the allow-rules-change label"
            else
              echo "::error::the base branch rules reject this PR (add the allow-rules-change label only for a reviewed rules change)"
              exit 1
            fi
          fi
      - name: Coherence audit cadence (on the PR's own last commit, not the merge commit)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/audit-status.sh --gate-push "$HEAD_SHA"
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  test:
    name: Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The targets we ship (rust-toolchain.toml), tested on their own systems.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            also_build: x86_64-apple-darwin # half of the universal binary
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          want=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustc --version | tee /dev/stderr | grep -F "rustc $want "
      - name: Linux musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Windows mingw linker
        if: runner.os == 'Windows'
        run: |
          # .cargo/config.toml names the cross linker used on the Mac; use the runner's gcc
          # when the prefixed name is not installed.
          if ! command -v x86_64-w64-mingw32-gcc; then
            command -v gcc
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Tests
        run: cargo nextest run --locked --profile ci --target ${{ matrix.target }}
      - name: Doctests
        run: cargo test --locked --doc --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build release (${{ matrix.also_build }})
        if: matrix.also_build
        run: cargo build --locked --release --target ${{ matrix.also_build }}
