# Tests on real Windows, macOS and Linux machines, on the targets we ship, plus the repository
# rules. Actions are pinned to commit SHAs (tag in the comment): a moved tag cannot change what
# runs.
#
# CI is an alarm, not the barrier: on a public repository anything pushed is already published
# when CI runs. The barrier is the local hooks (.githooks/, see CLAUDE.md). Also, a pull request
# runs the workflow file from its own branch, so changes to this file, scripts/ and .githooks/
# need a careful review.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: new advisories against unchanged dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests: a new push replaces the running check. main and scheduled runs: never
  # cancelled or merged, every pushed commit is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # also on Windows: stop on the first failing command

env:
  CARGO_TERM_COLOR: always
  # Note: RUSTFLAGS here replaces any `rustflags` in .cargo/config.toml; move both together.
  RUSTFLAGS: -D warnings

jobs:
  rules:
    name: Repository rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: audit cadence and per-commit scan
          persist-credentials: false
      - name: Tests of the rule scripts
        run: |
          sh scripts/test-scripts.sh
          sh scripts/test-cleanup.sh
      - name: Public repository check
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Base unknown (first push, force-push): tree of HEAD plus commits on no remote branch
          # (often none in CI: the local pre-push hook is the barrier for those).
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            sh scripts/check-public.sh --range "$BASE" "$HEAD_SHA"
          else
            sh scripts/check-public.sh --range remotes "$HEAD_SHA"
          fi
      - name: Public repository check (tree only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: sh scripts/check-public.sh --range tip HEAD
      - name: Coherence audit cadence (on the PR's own last commit, not the merge commit)
        if: github.event_name != 'schedule'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/audit-status.sh --gate-push "$HEAD_SHA"
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
      - name: Format
        if: github.event_name != 'schedule'
        run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.target }})
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The targets we ship (rust-toolchain.toml), tested on their own systems.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            also_build: x86_64-apple-darwin # half of the universal binary
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - name: Linux musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Windows mingw linker
        if: runner.os == 'Windows'
        run: |
          # .cargo/config.toml names the cross linker used on the Mac; use the runner's gcc
          # when the prefixed name is not installed.
          if ! command -v x86_64-w64-mingw32-gcc; then
            command -v gcc
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Tests of the rule scripts (this system's shell and grep)
        run: |
          sh scripts/test-scripts.sh
          sh scripts/test-cleanup.sh
      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Tests
        run: cargo nextest run --locked --profile ci --target ${{ matrix.target }}
      - name: Doctests
        run: cargo test --locked --doc --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build release (${{ matrix.also_build }})
        if: matrix.also_build
        run: cargo build --locked --release --target ${{ matrix.also_build }}
